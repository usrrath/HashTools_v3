
name: Build HashTools Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "packaging/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      # --------------------------------------
      # 1. Checkout
      # --------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------
      # 2. Python environment
      # --------------------------------------
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Display environment
        run: |
          python --version
          python -c "import platform; print(platform.platform()); print(platform.machine())"

      # --------------------------------------
      # 3. Validate source files
      # --------------------------------------
      - name: Verify project files
        run: |
          $required = @(
            "main.py",
            "requirements.txt",
            "packaging/HashTools_Setup.iss"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Required file missing: $file"
            }
          }

          Write-Host "Required project files found."

      - name: Validate Inno Setup script
        run: |
          $script = "packaging/HashTools_Setup.iss"
          $content = Get-Content $script -Raw

          if ($content -match '(?i)<CodeBlock|