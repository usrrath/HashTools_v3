name: Build HashTools Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify required files
        run: |
          foreach ($path in @('main.py', 'requirements.txt', 'packaging/HashTools_Setup.iss')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required file missing: $path"
            }
          }

      - name: Validate installer source
        run: |
          $issPath = 'packaging/HashTools_Setup.iss'
          $content = Get-Content -LiteralPath $issPath -Raw
          if ([string]::IsNullOrWhiteSpace($content)) {
            throw 'Inno Setup script is empty'
          }
          if ($content.Contains('<CodeBlock') -or $content.Contains('</CodeBlock>')) {
            throw 'Remove Markdown CodeBlock tags from the .iss file'
          }
          $first = Get-Content -LiteralPath $issPath | Where-Object { $_.Trim() } | Select-Object -First 1
          if ($first -notmatch '^\s*(#|;|\[)') {
            throw "Unexpected first line in Inno Setup source: $first"
          }
          foreach ($section in @('[Setup]', '[Files]', '[Icons]', '[Run]')) {
            if (-not $content.Contains($section)) {
              throw "Missing Inno Setup section: $section"
            }
          }
          if ($content.Contains('Tasks: desktopicon') -and -not $content.Contains('[Tasks]')) {
            throw 'Missing [Tasks] section for desktopicon'
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'requirements installation failed' }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller installation failed' }

      - name: Validate Python syntax
        run: |
          $targets = @('main.py')
          foreach ($dir in @('app', 'services')) {
            if (Test-Path -LiteralPath $dir -PathType Container) { $targets += $dir }
          }
          python -m compileall -q @targets
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed' }

      - name: Build Windows application
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name HashTools_v3 main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }

      - name: Verify executable and hash
        run: |
          $exe = 'dist/HashTools_v3/HashTools_v3.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Executable missing: $exe"
          }
          if ((Get-Item -LiteralPath $exe).Length -eq 0) { throw 'Executable is empty' }
          Get-FileHash -LiteralPath $exe -Algorithm SHA256 | Format-List

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HashTools_v3_Windows_x64_Portable
          path: dist/HashTools_v3/
          if-no-files-found: error
          retention-days: 30

      - name: Locate or install Inno Setup 6
        id: inno
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install Inno Setup' }
            $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'Inno Setup ISCC.exe not found' }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: |
          & '${{ steps.inno.outputs.compiler }}' 'packaging/HashTools_Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: exit code $LASTEXITCODE" }

      - name: Verify installer and hash
        run: |
          $installer = 'installer/HashTools_v3_Setup_Windows_x64.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer missing: $installer"
          }
          if ((Get-Item -LiteralPath $installer).Length -eq 0) { throw 'Installer is empty' }
          Get-FileHash -LiteralPath $installer -Algorithm SHA256 | Format-List

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HashTools_v3_Windows_x64_Installer
          path: installer/HashTools_v3_Setup_Windows_x64.exe
          if-no-files-found: error
          retention-days: 30
